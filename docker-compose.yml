services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: archive_ly
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - archive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive_ly"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://archive:${POSTGRES_PASSWORD}@db:5432/archive_ly"
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-30}
    command: ["sh","-c","npm --workspace apps/api run db:migrate && npm --workspace apps/api start"]
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - archive_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  ocr:
    build: .
    restart: unless-stopped
    command: ["npm","--workspace","apps/api","run","worker:ocr"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://archive:${POSTGRES_PASSWORD}@db:5432/archive_ly"
      DATABASE_SSL: "false"
      UPLOAD_DIR: /app/uploads
      TESSERACT_LANG: ara+eng
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-15}
    volumes:
      - archive_uploads:/app/uploads
    depends_on:
      api:
        condition: service_started
  backup:
    profiles: ["tools"]
    build: .
    restart: "no"
    command: ["npm","--workspace","apps/api","run","backup"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://archive:${POSTGRES_PASSWORD}@db:5432/archive_ly"
      DATABASE_SSL: "false"
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /backups
    volumes:
      - archive_uploads:/app/uploads
      - archive_backups:/backups
    depends_on:
      api:
        condition: service_started
  backup-scheduler:
    profiles: ["tools"]
    build: .
    restart: unless-stopped
    command: ["npm","--workspace","apps/api","run","backup:scheduler"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://archive:${POSTGRES_PASSWORD}@db:5432/archive_ly"
      DATABASE_SSL: "false"
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - archive_uploads:/app/uploads
      - archive_backups:/backups
    depends_on:
      api:
        condition: service_started
volumes:
  archive_pgdata:
  archive_uploads:
  archive_backups:
