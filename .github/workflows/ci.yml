name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check apps/api/src/ops/backup.js
      - run: node --check apps/api/src/ops/restore.js
      - run: node --check apps/api/src/ops/retention.js
      - run: node --check apps/api/src/ops/scheduler.js
      - run: npm run build:web
