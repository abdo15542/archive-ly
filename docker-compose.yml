services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: archive_ly
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive_dev_password
    ports:
      - "5432:5432"
    volumes:
      - archive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive_ly"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  archive_pgdata:
