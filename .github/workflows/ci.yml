name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archive
          POSTGRES_PASSWORD: archive
          POSTGRES_DB: archive_ly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archive -d archive_ly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://archive:archive@localhost:5432/archive_ly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=optional --no-audit --no-fund
      - name: Ensure Linux Rollup native binary is installed
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save --package-lock=false "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
      - name: Install OCR system tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara librsvg2-bin fonts-noto-core
      - run: npm run db:migrate
      - name: Verify migrations are idempotent
        run: npm run db:migrate
      - run: npm test
      - run: node --check apps/api/src/server.js
      - run: node --check apps/api/src/db/pool.js
      - run: node --check apps/api/src/routes/admin.js
      - run: node --check apps/api/src/routes/documents.js
      - run: node --check apps/api/src/db/migrate.js
      - run: node --check apps/api/src/workers/ocr.js
      - run: node --check apps/api/src/workers/ocr-runner.js
      - run: node --check apps/api/src/workers/ocr-heartbeat.js
      - run: node --check apps/api/src/ops/file-hash.js
      - run: node --check apps/api/src/utils/file-integrity.js
      - run: node --check apps/api/src/ops/operation-log.js
      - run: node --check apps/api/src/ops/backup.js
      - run: node --check apps/api/src/ops/restore.js
      - run: node --check apps/api/src/ops/retention.js
      - run: node --check apps/api/src/ops/scheduler.js
      - run: npm run build:web
      - name: Build production Docker image
        run: docker build -t archive-ly:ci .
